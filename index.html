<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麻雀ゲーム</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a5c2a;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 8px;
      color: #f0e68c;
      user-select: none;
    }

    h1 { font-size: 1.3rem; letter-spacing: 0.1em; text-shadow: 0 2px 4px rgba(0,0,0,0.5); margin-bottom: 6px; }

    /* ── スコアバー ── */
    .score-bar { width: 100%; max-width: 960px; display: flex; gap: 4px; margin-bottom: 6px; }
    .score-item {
      flex: 1; background: rgba(0,0,0,0.4); border-radius: 7px;
      padding: 4px 8px; text-align: center; font-size: 0.75rem;
    }
    .score-item .sname { display: block; opacity: 0.75; font-size: 0.65rem; }
    .score-item .sval  { display: block; font-weight: bold; font-size: 0.9rem; }
    .score-item.is-dealer { border: 1px solid #f0e68c; }
    .score-item.in-riichi .sname::after { content: ' ⛩'; }

    /* ── ステータスバー ── */
    .status-bar {
      width: 100%; max-width: 960px;
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,0.35); border-radius: 8px;
      padding: 5px 12px; margin-bottom: 6px; font-size: 0.82rem; gap: 8px;
    }
    #status-msg { font-weight: 600; flex: 1; }

    /* ── ドラバー ── */
    .dora-bar {
      width: 100%; max-width: 960px;
      display: none; align-items: center; gap: 8px;
      background: rgba(0,0,0,0.3); border-radius: 8px;
      padding: 5px 12px; margin-bottom: 6px; font-size: 0.75rem;
    }
    .dora-bar.visible { display: flex; }
    .dora-label { opacity: 0.8; white-space: nowrap; }
    .dora-tiles { display: flex; gap: 3px; }

    /* ── コントロール ── */
    .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 6px; }
    button {
      background: #f0e68c; border: none; border-radius: 8px;
      padding: 8px 18px; font-size: 0.88rem; font-weight: bold;
      cursor: pointer; color: #1a1a1a;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      transition: background 0.12s, transform 0.1s;
    }
    button:hover:not(:disabled) { background: #f7d94c; transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    button.btn-ron    { background: #e63946; color: #fff; }
    button.btn-ron:hover:not(:disabled) { background: #b02832; }
    button.btn-riichi { background: #2471a3; color: #fff; }
    button.btn-riichi:hover:not(:disabled) { background: #1a5480; }

    /* ── ロンパネル ── */
    .ron-panel {
      display: none; background: rgba(0,0,0,0.85);
      border: 2px solid #f0e68c; border-radius: 10px;
      padding: 8px 18px; margin-bottom: 6px; text-align: center;
      flex-direction: column; align-items: center; gap: 7px;
      width: 100%; max-width: 960px;
    }
    .ron-panel.visible { display: flex; }
    .ron-panel p { font-size: 0.85rem; }
    .ron-btns { display: flex; gap: 10px; }

    /* ── テーブル ── */
    .table {
      width: 100%; max-width: 960px;
      background: #155a28; border: 4px solid #7a5c1a;
      border-radius: 18px; padding: 10px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .area { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .area-label { font-size: 0.68rem; opacity: 0.8; letter-spacing: 0.05em; }
    .middle { display: grid; grid-template-columns: 130px 1fr 130px; gap: 8px; align-items: start; }

    /* ── センター ── */
    .center {
      background: rgba(0,0,0,0.22); border-radius: 10px; padding: 6px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto auto auto;
      gap: 4px; align-items: center; justify-items: center;
    }
    .disc-zone {
      display: flex; flex-wrap: wrap; gap: 1px;
      justify-content: center; align-items: flex-start; min-height: 32px;
    }
    .disc-zone.top    { grid-column: 2; grid-row: 1; }
    .disc-zone.left   { grid-column: 1; grid-row: 2; justify-content: flex-end; }
    .disc-zone.right  { grid-column: 3; grid-row: 2; justify-content: flex-start; }
    .disc-zone.bottom { grid-column: 2; grid-row: 3; }
    .center-info {
      grid-column: 2; grid-row: 2;
      display: flex; flex-direction: column; align-items: center;
      padding: 6px 10px; font-size: 0.65rem; opacity: 0.7;
      gap: 2px;
    }
    .center-info .round-label { font-size: 0.8rem; font-weight: bold; opacity: 1; color: #f0e68c; }

    /* ── 山牌ディスプレイ ── */
    .wall-display {
      background: rgba(0,0,0,0.25); border-radius: 8px;
      padding: 5px 8px; margin: 0 0 0 0;
    }
    .wall-display-header {
      font-size: 0.65rem; opacity: 0.75; margin-bottom: 4px;
      display: flex; align-items: center; gap: 6px;
    }
    .wall-display-header .wall-count-num { font-weight: bold; font-size: 0.8rem; color: #f0e68c; opacity: 1; }
    .wall-row {
      display: flex; flex-wrap: nowrap; gap: 1px;
      min-height: 18px; overflow: hidden;
    }

    /* ── 山牌の1枚 ── */
    .wtile {
      width: 11px; height: 16px; flex-shrink: 0;
      border-radius: 1px 1px 2px 2px;
      background: linear-gradient(145deg, #4a80b8 0%, #2a5890 60%, #1a3860 100%);
      border-top: 1px solid #7ab0e8;
      border-left: 1px solid #5a90c8;
      border-bottom: 2px solid #0a1830;
      border-right: 1px solid #2a4870;
      box-shadow: 1px 1px 2px rgba(0,0,0,0.4);
      transition: opacity 0.2s;
    }
    .wtile.low { background: linear-gradient(145deg, #b84040, #882020, #501010); border-top-color: #e87070; border-left-color: #c85050; border-bottom-color: #200808; }

    /* ── 手牌 ── */
    .hand-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 2px; min-height: 42px; }
    .player-hand { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-end; gap: 2px; min-height: 90px; padding: 6px 4px 4px; }

    /* ═══════════════════════════════════════
       牌のデザイン（リアル麻雀タイル風）
    ═══════════════════════════════════════ */
    .tile {
      display: inline-flex; flex-direction: column;
      align-items: center; justify-content: center;
      /* アイボリーグラデーション */
      background: linear-gradient(160deg, #fefcf2 0%, #f8f0d8 50%, #eee0b8 100%);
      /* 立体感のあるボーダー */
      border-top: 2px solid #fffef8;
      border-left: 2px solid #fdf8ee;
      border-right: 2px solid #9a7830;
      border-bottom: 3px solid #7a5810;
      border-radius: 3px 3px 5px 5px;
      /* 影で3D感 */
      box-shadow: 2px 3px 6px rgba(0,0,0,0.5),
                  inset 0 1px 0 rgba(255,255,255,0.8),
                  inset 0 0 0 1px rgba(200,160,80,0.3);
      position: relative; flex-shrink: 0;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    /* サイズ */
    .tile.sz-lg { width: 48px; height: 66px; }
    .tile.sz-sm { width: 28px; height: 40px; }
    .tile.sz-xs { width: 22px; height: 30px; }

    /* 牌面テキスト */
    .tile-main { font-weight: 900; pointer-events: none; display: block; line-height: 1; font-family: 'Yu Gothic', 'Meiryo', serif; }
    .tile-sub  { pointer-events: none; display: block; font-weight: bold; line-height: 1; font-family: 'Yu Gothic', 'Meiryo', serif; }

    .tile.sz-lg .tile-main { font-size: 1.6rem; }
    .tile.sz-lg .tile-sub  { font-size: 0.58rem; margin-top: 1px; }
    .tile.sz-sm .tile-main { font-size: 1.05rem; }
    .tile.sz-sm .tile-sub  { font-size: 0.42rem; margin-top: 0; }
    .tile.sz-xs .tile-main { font-size: 0.82rem; }
    .tile.sz-xs .tile-sub  { font-size: 0.34rem; }

    /* スーツ別カラー */
    .tile.suit-man  .tile-main { color: #c0281a; text-shadow: 0 1px 0 rgba(255,120,80,0.3); }
    .tile.suit-man  .tile-sub  { color: #c0281a; }
    .tile.suit-pin  .tile-main { color: #1a55a8; text-shadow: 0 1px 0 rgba(80,140,255,0.3); }
    .tile.suit-pin  .tile-sub  { color: #1a55a8; }
    .tile.suit-sou  .tile-main { color: #1a7838; text-shadow: 0 1px 0 rgba(60,180,80,0.3); }
    .tile.suit-sou  .tile-sub  { color: #1a7838; }
    /* 字牌個別カラー */
    .tile.suit-jihai.jh-wind  .tile-main { color: #1a2a6a; }
    .tile.suit-jihai.jh-haku  .tile-main { color: #888; }
    .tile.suit-jihai.jh-hatsu .tile-main { color: #1a7838; }
    .tile.suit-jihai.jh-chun  .tile-main { color: #c0281a; }

    /* 裏面 */
    .tile.face-down {
      background: linear-gradient(145deg, #2c6090, #1a3d60, #102840);
      border-top-color: #5a90c0; border-left-color: #4a80b0;
      border-bottom-color: #080e18; border-right-color: #1a3050;
      box-shadow: 2px 3px 6px rgba(0,0,0,0.6), inset 0 1px 0 rgba(100,160,220,0.4);
    }
    /* 裏面パターン */
    .tile.face-down::after {
      content: ''; position: absolute; inset: 3px;
      background: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 2px,
        transparent 2px, transparent 6px
      );
      border-radius: 2px;
    }

    .tile.clickable { cursor: pointer; }
    .tile.clickable:hover {
      transform: translateY(-8px);
      box-shadow: 2px 10px 16px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.8);
    }
    .tile.selected {
      transform: translateY(-22px) !important;
      border-top-color: #e63946 !important;
      border-left-color: #e63946 !important;
      background: linear-gradient(160deg, #fff5f5 0%, #ffe8e8 100%) !important;
      box-shadow: 2px 14px 20px rgba(0,0,0,0.6), 0 0 0 2px #e63946 !important;
    }
    .drawn-gap { width: 14px; flex-shrink: 0; align-self: stretch; }

    /* ── オーバーレイ ── */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.72); z-index: 200; align-items: center; justify-content: center; }
    .overlay.visible { display: flex; }
    .overlay-box { background: #1a5c2a; border: 3px solid #f0e68c; border-radius: 16px; padding: 28px 40px; text-align: center; max-width: 92vw; }
    .overlay-box h2 { font-size: 1.7rem; margin-bottom: 8px; }
    .overlay-box .ov-detail { margin-bottom: 6px; font-size: 0.9rem; opacity: 0.85; }
    .overlay-box .ov-yaku { margin-bottom: 6px; font-size: 0.82rem; color: #ffe080; }
    .overlay-box .ov-pts  { margin-bottom: 16px; font-size: 1rem; font-weight: bold; }
    .overlay-btns { display: flex; gap: 10px; justify-content: center; }

    .hint { font-size: 0.7rem; opacity: 0.6; margin-top: 2px; }
  </style>
</head>
<body>

<h1>麻雀ゲーム</h1>

<div class="score-bar" id="score-bar">
  <div class="score-item" id="sc0"><span class="sname">あなた（東）</span><span class="sval">25000</span></div>
  <div class="score-item" id="sc1"><span class="sname">CPU1（南）</span><span class="sval">25000</span></div>
  <div class="score-item" id="sc2"><span class="sname">CPU2（西）</span><span class="sval">25000</span></div>
  <div class="score-item" id="sc3"><span class="sname">CPU3（北）</span><span class="sval">25000</span></div>
</div>

<div class="status-bar">
  <span id="status-msg">「ゲームスタート」を押してください</span>
</div>

<div class="dora-bar" id="dora-bar">
  <span class="dora-label">ドラ表示牌：</span>
  <div class="dora-tiles" id="dora-tiles"></div>
</div>

<div class="controls">
  <button id="btn-start"   onclick="startGame()">ゲームスタート</button>
  <button id="btn-riichi"  onclick="declareRiichi()" disabled class="btn-riichi">リーチ</button>
  <button id="btn-discard" onclick="playerDiscard()" disabled>捨てる</button>
</div>

<div class="ron-panel" id="ron-panel">
  <p id="ron-msg"></p>
  <div class="ron-btns">
    <button class="btn-ron" onclick="declareRon()">ロン！</button>
    <button onclick="passRon()">スキップ</button>
  </div>
</div>

<div class="table">
  <div class="area">
    <div class="area-label">CPU2（上家）</div>
    <div class="hand-row" id="hand-cpu2"></div>
  </div>

  <div class="middle">
    <div class="area">
      <div class="area-label">CPU1（対面）</div>
      <div class="hand-row" id="hand-cpu1" style="max-width:130px"></div>
    </div>
    <div class="center">
      <div class="disc-zone top"    id="disc-2"></div>
      <div class="disc-zone left"   id="disc-1"></div>
      <div class="center-info">
        <span class="round-label" id="round-label">—</span>
        <span>局</span>
      </div>
      <div class="disc-zone right"  id="disc-3"></div>
      <div class="disc-zone bottom" id="disc-0"></div>
    </div>
    <div class="area">
      <div class="area-label">CPU3（下家）</div>
      <div class="hand-row" id="hand-cpu3" style="max-width:130px"></div>
    </div>
  </div>

  <!-- 山牌ビジュアル表示 -->
  <div class="wall-display">
    <div class="wall-display-header">
      山牌：<span class="wall-count-num" id="wall-num">—</span> 枚
    </div>
    <div class="wall-row" id="wall-row"></div>
  </div>

  <div class="area">
    <div class="area-label">あなたの手牌</div>
    <div class="player-hand" id="hand-player"></div>
    <div class="hint" id="hint-text"></div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="ov-title"></h2>
    <p class="ov-detail" id="ov-detail"></p>
    <p class="ov-yaku"   id="ov-yaku"></p>
    <p class="ov-pts"    id="ov-pts"></p>
    <div class="overlay-btns">
      <button id="btn-next" onclick="nextHand()">次の局へ</button>
      <button onclick="startGame()">リセット</button>
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// 定数
// ═══════════════════════════════════════════════════════
const CCW_ORDER = [0, 3, 2, 1]; // 反時計回り

// 牌表示用（main文字・sub文字）
const SUITS = {
  man:   { cls:'man',   chars:['一','二','三','四','五','六','七','八','九'], sub:'萬' },
  pin:   { cls:'pin',   chars:['①','②','③','④','⑤','⑥','⑦','⑧','⑨'], sub:'' },
  sou:   { cls:'sou',   chars:['１','２','３','４','５','６','７','８','９'], sub:'索' },
  jihai: { cls:'jihai', chars:['東','南','西','北','白','發','中'], sub:'' },
};
// ステータスメッセージ用
const TNAMES = {
  man:   ['１萬','２萬','３萬','４萬','５萬','６萬','７萬','８萬','９萬'],
  pin:   ['１筒','２筒','３筒','４筒','５筒','６筒','７筒','８筒','９筒'],
  sou:   ['１索','２索','３索','４索','５索','６索','７索','８索','９索'],
  jihai: ['東','南','西','北','白','發','中'],
};
const WIND_NAMES = ['東','南','西','北'];
const SUIT_ORDER = { man:0, pin:1, sou:2, jihai:3 };
const PNAMES = ['あなた','CPU1','CPU2','CPU3'];

// ═══════════════════════════════════════════════════════
// 状態
// ═══════════════════════════════════════════════════════
let G = {};
function initG(keepScores) {
  const prev = G;
  G = {
    phase: 'idle',
    wall: [], wangpai: [], doraIndicators: [],
    players: [], cur: 0, sel: -1, canRiichi: false,
    ronCb: null, ronFromPidx: -1,
    scores:    keepScores ? prev.scores    : [25000,25000,25000,25000],
    dealer:    keepScores ? prev.dealer    : 0,
    roundWind: keepScores ? prev.roundWind : 0,
    handCount: keepScores ? prev.handCount : 0,
    riichi:    [false,false,false,false],
    riichiPot: keepScores ? prev.riichiPot : 0,
    ippatsu:   [false,false,false,false],
    doubleRiichi: [false,false,false,false],
    discardsMade: [0,0,0,0],
  };
}
initG(false);

let _handEls = [], _drawnEl = null;

// ═══════════════════════════════════════════════════════
// 牌ユーティリティ
// ═══════════════════════════════════════════════════════
function buildDeck() {
  const d = []; let id = 0;
  for (const s of Object.keys(SUITS))
    for (let i = 0; i < SUITS[s].chars.length; i++)
      for (let k = 0; k < 4; k++) d.push({suit:s, idx:i, id:id++});
  return d;
}
function shuffle(a) {
  for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
const tileCmp = (a,b) => (SUIT_ORDER[a.suit]-SUIT_ORDER[b.suit]) || (a.idx-b.idx);
const sortHand = h => h.slice().sort(tileCmp);
const tname  = t => TNAMES[t.suit][t.idx];
const tkey   = t => t.suit+'-'+t.idx;

function doraFromIndicator(ind) {
  if(ind.suit==='jihai'){
    if(ind.idx<=3) return {suit:'jihai',idx:(ind.idx+1)%4};
    if(ind.idx===4) return {suit:'jihai',idx:5};
    if(ind.idx===5) return {suit:'jihai',idx:6};
    return {suit:'jihai',idx:4};
  }
  return {suit:ind.suit, idx:(ind.idx+1)%9};
}
function countDora(hand14) {
  return G.doraIndicators.reduce((sum,ind)=>{
    const d=doraFromIndicator(ind);
    return sum+hand14.filter(t=>t.suit===d.suit&&t.idx===d.idx).length;
  },0);
}

// ═══════════════════════════════════════════════════════
// あがり判定
// ═══════════════════════════════════════════════════════
function cnt(tiles) {
  const c={};
  for(const t of tiles){const k=tkey(t);c[k]=(c[k]||0)+1;}
  return c;
}
function canMentsu(c) {
  let mk=null;
  for(const k of Object.keys(c)){
    if(!mk){mk=k;continue;}
    const[ms,mi]=mk.split('-');const[ks,ki]=k.split('-');
    if((SUIT_ORDER[ks]-SUIT_ORDER[ms])||(+ki-+mi)<0)mk=k;
  }
  if(!mk)return true;
  const[suit,is]=mk.split('-');const idx=+is;
  if(c[mk]>=3){const nc={...c};nc[mk]-=3;if(!nc[mk])delete nc[mk];if(canMentsu(nc))return true;}
  if(suit!=='jihai'){
    const k1=suit+'-'+(idx+1),k2=suit+'-'+(idx+2);
    if((c[k1]||0)>=1&&(c[k2]||0)>=1){
      const nc={...c};
      nc[mk]--;if(!nc[mk])delete nc[mk];
      nc[k1]--;if(!nc[k1])delete nc[k1];
      nc[k2]--;if(!nc[k2])delete nc[k2];
      if(canMentsu(nc))return true;
    }
  }
  return false;
}
function isKokushi(hand) {
  const terms=['man-0','man-8','pin-0','pin-8','sou-0','sou-8',
    'jihai-0','jihai-1','jihai-2','jihai-3','jihai-4','jihai-5','jihai-6'];
  const c=cnt(hand);
  if(terms.filter(k=>c[k]).length!==13)return false;
  return terms.some(k=>(c[k]||0)>=2);
}
function isWin(hand) {
  if(hand.length!==14)return false;
  if(isKokushi(hand))return true;
  const c=cnt(hand);
  const vs=Object.values(c);
  if(vs.length===7&&vs.every(v=>v===2))return true;
  const tried=new Set();
  for(const t of hand){
    const k=tkey(t);
    if(tried.has(k))continue;tried.add(k);
    if((c[k]||0)>=2){const nc={...c};nc[k]-=2;if(!nc[k])delete nc[k];if(canMentsu(nc))return true;}
  }
  return false;
}

// ═══════════════════════════════════════════════════════
// 手牌分解
// ═══════════════════════════════════════════════════════
function decompMentsu(tiles) {
  if(!tiles.length)return[];
  const s=sortHand(tiles),f=s[0];
  const same=s.filter(t=>t.suit===f.suit&&t.idx===f.idx).length;
  if(same>=3){
    let rem=[...s],rm=0;
    rem=rem.filter(t=>{if(rm<3&&t.suit===f.suit&&t.idx===f.idx){rm++;return false;}return true;});
    const sub=decompMentsu(rem);
    if(sub!==null)return[{type:'k',suit:f.suit,idx:f.idx},...sub];
  }
  if(f.suit!=='jihai'){
    const t1=s.find(t=>t.suit===f.suit&&t.idx===f.idx+1);
    const t2=s.find(t=>t.suit===f.suit&&t.idx===f.idx+2);
    if(t1&&t2){
      const i0=s.indexOf(f),i1=s.indexOf(t1),i2=s.indexOf(t2);
      const rem=s.filter((_,i)=>i!==i0&&i!==i1&&i!==i2);
      const sub=decompMentsu(rem);
      if(sub!==null)return[{type:'s',suit:f.suit,idx:f.idx},...sub];
    }
  }
  return null;
}
function decompHand(hand14) {
  const results=[],tried=new Set();
  for(const t of hand14){
    const k=tkey(t);
    if(tried.has(k))continue;tried.add(k);
    const same=hand14.filter(x=>x.suit===t.suit&&x.idx===t.idx).length;
    if(same<2)continue;
    let rem=[...hand14],rm=0;
    rem=rem.filter(x=>{if(rm<2&&x.suit===t.suit&&x.idx===t.idx){rm++;return false;}return true;});
    const m=decompMentsu(rem);
    if(m!==null)results.push({pair:t,mentsu:m});
  }
  return results;
}

function isTenpai(hand13) {
  for(const s of Object.keys(SUITS))
    for(let i=0;i<SUITS[s].chars.length;i++)
      if(isWin([...hand13,{suit:s,idx:i,id:-1}]))return true;
  return false;
}
function handAfterDiscard(sel,isDrawn) {
  const p=G.players[0];
  if(isDrawn)return sortHand(p.hand);
  const s=sortHand(p.hand);
  return sortHand([...s.filter((_,i)=>i!==sel),p.drawn]);
}

// ═══════════════════════════════════════════════════════
// 役判定
// ═══════════════════════════════════════════════════════
function seatWind(pidx) {
  const dp=CCW_ORDER.indexOf(G.dealer),pp=CCW_ORDER.indexOf(pidx);
  return(pp-dp+4)%4;
}
function isRyanmen(winTile,m) {
  if(winTile.suit!==m.suit||m.type!=='s')return false;
  const w=winTile.idx,s=m.idx;
  if(w===s&&s+3<=8)return true;
  if(w===s+2&&s>=1)return true;
  return false;
}
function isPinfu(decomp,winTile,pidx) {
  if(decomp.mentsu.some(m=>m.type==='k'))return false;
  const p=decomp.pair;
  if(p.suit==='jihai'){
    const i=p.idx;
    if(i>=4)return false;
    if(i===G.roundWind)return false;
    if(i===seatWind(pidx))return false;
  }
  return decomp.mentsu.some(m=>isRyanmen(winTile,m));
}
function isTermHonor(t){return t.suit==='jihai'||t.idx===0||t.idx===8;}
function isTerminal(t){return t.suit!=='jihai'&&(t.idx===0||t.idx===8);}

function isChuurenPoutou(hand14) {
  for(const s of['man','pin','sou']){
    const tiles=hand14.filter(t=>t.suit===s);
    if(tiles.length!==14)continue;
    const c=cnt(tiles);
    const pat=[3,1,1,1,1,1,1,1,3];
    let ok=true;
    for(let i=0;i<9;i++){if((c[s+'-'+i]||0)<pat[i]){ok=false;break;}}
    if(ok)return true;
  }
  return false;
}

function detectYaku(hand14,winTile,isTsumo,pidx,extra={}) {
  const yaku=[];
  const c=cnt(hand14);
  const sw=seatWind(pidx);
  const vs=Object.values(c);
  const isChii=(vs.length===7&&vs.every(v=>v===2));

  // 役満
  if(isTsumo&&extra.tenho)return[{name:'天和',han:13,yakuman:true}];
  if(isTsumo&&extra.chiho)return[{name:'地和',han:13,yakuman:true}];
  if(isKokushi(hand14))return[{name:'国士無双',han:13,yakuman:true}];
  if(isChuurenPoutou(hand14))return[{name:'九蓮宝燈',han:13,yakuman:true}];
  if(hand14.every(t=>t.suit==='jihai'))return[{name:'字一色',han:13,yakuman:true}];
  const greens=new Set(['sou-1','sou-2','sou-3','sou-5','sou-7','jihai-5']);
  if(hand14.every(t=>greens.has(tkey(t))))return[{name:'緑一色',han:13,yakuman:true}];
  if(hand14.every(t=>isTerminal(t)))return[{name:'清老頭',han:13,yakuman:true}];
  if((c['jihai-4']||0)>=3&&(c['jihai-5']||0)>=3&&(c['jihai-6']||0)>=3)return[{name:'大三元',han:13,yakuman:true}];
  if(['jihai-0','jihai-1','jihai-2','jihai-3'].every(k=>(c[k]||0)>=3))return[{name:'大四喜',han:13,yakuman:true}];

  if(!isChii){
    const decomps=decompHand(hand14);
    const d4=decomps.find(d=>d.mentsu.every(m=>m.type==='k'));
    if(d4){
      const isTanki=d4.pair.suit===winTile.suit&&d4.pair.idx===winTile.idx;
      return[{name:isTanki?'四暗刻単騎':'四暗刻',han:13,yakuman:true}];
    }
    const windKeys=['jihai-0','jihai-1','jihai-2','jihai-3'];
    const wKotsu=windKeys.filter(k=>(c[k]||0)>=3).length;
    const wPair=windKeys.includes(tkey(decomps[0]?.pair||{}));
    if(wKotsu===3&&wPair)return[{name:'小四喜',han:13,yakuman:true}];
  }

  // 通常役
  if(G.doubleRiichi[pidx]) yaku.push({name:'ダブルリーチ',han:2});
  else if(G.riichi[pidx])  yaku.push({name:'リーチ',han:1});
  if(G.ippatsu[pidx])      yaku.push({name:'一発',han:1});

  if(isChii){
    const doraH=countDora(hand14);
    const res=[...yaku,{name:'七対子',han:2}];
    if(doraH>0)res.push({name:'ドラ',han:doraH});
    return res;
  }

  if(isTsumo)    yaku.push({name:'門前清自摸和',han:1});
  if(isTsumo&&extra.haitei)  yaku.push({name:'海底摸月',han:1});
  if(!isTsumo&&extra.houtei) yaku.push({name:'河底撈魚',han:1});

  if(hand14.every(t=>t.suit!=='jihai'&&t.idx>=1&&t.idx<=7))yaku.push({name:'タンヤオ',han:1});

  if((c['jihai-4']||0)>=3)yaku.push({name:'白',han:1});
  if((c['jihai-5']||0)>=3)yaku.push({name:'發',han:1});
  if((c['jihai-6']||0)>=3)yaku.push({name:'中',han:1});
  if((c[`jihai-${G.roundWind}`]||0)>=3)yaku.push({name:'場風 '+WIND_NAMES[G.roundWind],han:1});
  if(sw!==G.roundWind&&(c[`jihai-${sw}`]||0)>=3)yaku.push({name:'自風 '+WIND_NAMES[sw],han:1});

  const decomps=decompHand(hand14);
  if(decomps.some(d=>isPinfu(d,winTile,pidx)))yaku.push({name:'ピンフ',han:1});

  if(decomps.length){
    const d=decomps[0];

    // 一盃口・二盃口
    const seqMap={};
    d.mentsu.filter(m=>m.type==='s').forEach(m=>{const k=m.suit+m.idx;seqMap[k]=(seqMap[k]||0)+1;});
    const maxSeq=Math.max(0,...Object.values(seqMap));
    const pairsOf2=Object.values(seqMap).filter(v=>v>=2).length;
    if(pairsOf2>=2||maxSeq>=4)yaku.push({name:'二盃口',han:3});
    else if(pairsOf2===1)yaku.push({name:'一盃口',han:1});

    if(d.mentsu.every(m=>m.type==='k'))yaku.push({name:'対々和',han:2});
    const ankos=d.mentsu.filter(m=>m.type==='k').length;
    if(ankos>=3)yaku.push({name:'三暗刻',han:2});

    const drK=['jihai-4','jihai-5','jihai-6'];
    const drKotsu=drK.filter(k=>(c[k]||0)>=3).length;
    if(drKotsu===2&&drK.includes(tkey(d.pair)))yaku.push({name:'小三元',han:2});

    for(const s of['man','pin','sou']){
      const seqs=d.mentsu.filter(m=>m.type==='s'&&m.suit===s).map(m=>m.idx);
      if(seqs.includes(0)&&seqs.includes(3)&&seqs.includes(6)){yaku.push({name:'一気通貫',han:2});break;}
    }
    for(let i=0;i<9;i++){
      if(['man','pin','sou'].every(s=>d.mentsu.some(m=>m.type==='s'&&m.suit===s&&m.idx===i))){
        yaku.push({name:'三色同順',han:2});break;
      }
    }
    for(let i=0;i<9;i++){
      if(['man','pin','sou'].every(s=>(c[s+'-'+i]||0)>=3)){
        yaku.push({name:'三色同刻',han:2});break;
      }
    }

    // チャンタ系
    const allTermHonor=d.mentsu.every(m=>{
      if(m.type==='k')return isTermHonor({suit:m.suit,idx:m.idx});
      return isTermHonor({suit:m.suit,idx:m.idx})||isTermHonor({suit:m.suit,idx:m.idx+2});
    })&&isTermHonor(d.pair);
    const hasJihai=hand14.some(t=>t.suit==='jihai');
    if(allTermHonor&&hasJihai)yaku.push({name:'チャンタ',han:2});
    if(allTermHonor&&!hasJihai&&hand14.every(t=>t.suit!=='jihai')){
      const ci=yaku.findIndex(y=>y.name==='チャンタ');
      if(ci!==-1)yaku.splice(ci,1);
      yaku.push({name:'純全帯么九',han:3});
    }
  }

  // 混一色・清一色
  const nonJ=hand14.filter(t=>t.suit!=='jihai');
  const hasJH=hand14.some(t=>t.suit==='jihai');
  if(nonJ.length&&hasJH&&new Set(nonJ.map(t=>t.suit)).size===1)yaku.push({name:'混一色',han:3});
  if(!hasJH&&new Set(hand14.map(t=>t.suit)).size===1)yaku.push({name:'清一色',han:6});

  const doraHan=countDora(hand14);
  if(doraHan>0)yaku.push({name:'ドラ',han:doraHan});
  return yaku;
}

// ═══════════════════════════════════════════════════════
// 符・点数計算
// ═══════════════════════════════════════════════════════
function calcFu(hand14,winTile,isTsumo,pidx) {
  const c=cnt(hand14),vs=Object.values(c);
  if(vs.length===7&&vs.every(v=>v===2))return 25;
  const decomps=decompHand(hand14);
  if(!decomps.length)return 30;
  const pD=decomps.find(d=>isPinfu(d,winTile,pidx));
  if(pD)return isTsumo?20:30;
  const d=decomps[0];
  let fu=20;
  fu+=isTsumo?2:10;
  const pr=d.pair;
  if(pr.suit==='jihai'){const i=pr.idx;if(i>=4||i===G.roundWind||i===seatWind(pidx))fu+=2;}
  for(const m of d.mentsu){
    if(m.type==='s')continue;
    const honor=m.suit==='jihai'||m.idx===0||m.idx===8;
    fu+=honor?8:4;
  }
  if(d.pair.suit===winTile.suit&&d.pair.idx===winTile.idx)fu+=2;
  else{
    for(const m of d.mentsu){
      if(m.type!=='s'||m.suit!==winTile.suit)continue;
      const w=winTile.idx,s=m.idx;
      if(w===s+1){fu+=2;break;}
      if(w===s&&s===6){fu+=2;break;}
      if(w===s+2&&s===0){fu+=2;break;}
    }
  }
  return Math.max(30,Math.ceil(fu/10)*10);
}
function calcPoints(han,fu,isDealer,isTsumo) {
  const r100=v=>Math.ceil(v/100)*100;
  let base;
  if(han>=13)base=8000;
  else if(han>=8)base=4000;
  else if(han>=7)base=3000;
  else if(han>=5||(han===4&&fu>=30)||(han===3&&fu>=70))base=2000;
  else base=fu*Math.pow(2,han+2);
  if(isDealer){
    if(isTsumo){const e=r100(base*2);return{type:'all',each:e,total:e*3};}
    return{type:'ron',total:r100(base*6)};
  }else{
    if(isTsumo){const dp=r100(base*2),op=r100(base);return{type:'tsumo',dealerPays:dp,otherPay:op,total:dp+op*2};}
    return{type:'ron',total:r100(base*4)};
  }
}
function applyWin(winnerPidx,loserPidx,hand14,winTile,isTsumo,extra={}) {
  const yaku=detectYaku(hand14,winTile,isTsumo,winnerPidx,extra);
  if(!yaku.filter(y=>y.name!=='ドラ').length)return null;
  const han=yaku.reduce((s,y)=>s+y.han,0);
  const fu=calcFu(hand14,winTile,isTsumo,winnerPidx);
  const isDealer=G.dealer===winnerPidx;
  const pts=calcPoints(han,fu,isDealer,isTsumo);
  if(isTsumo){
    for(let i=0;i<4;i++){
      if(i===winnerPidx)continue;
      const pay=(G.dealer===i)?pts.dealerPays:(pts.each||pts.otherPay);
      G.scores[i]-=pay;G.scores[winnerPidx]+=pay;
    }
  }else{G.scores[loserPidx]-=pts.total;G.scores[winnerPidx]+=pts.total;}
  G.scores[winnerPidx]+=G.riichiPot;G.riichiPot=0;
  return{yaku,han,fu,pts};
}

// CPU AI

function cpuChooseDiscard(hand) {
  const s=sortHand(hand),c=cnt(s);
  let wi=0,ws=Infinity;
  s.forEach((t,i)=>{
    const k=tkey(t);let score=(c[k]||0)*10;
    if(t.suit!=='jihai')for(const d of[-2,-1,1,2]){if(c[t.suit+'-'+(t.idx+d)])score+=Math.abs(d)===1?5:2;}
    if(score<ws){ws=score;wi=i;}
  });
  return wi;
}

function nextPlayerInTurn(pidx){return CCW_ORDER[(CCW_ORDER.indexOf(pidx)+1)%4];}
function startNextTurn(fromPidx) {
  const next=nextPlayerInTurn(fromPidx);
  if(next===0){
    G.cur=0;msg('あなたの番です...');syncButtons();render();
    setTimeout(()=>startPlayerTurn(),350);
  }else{
    G.phase='cpu';G.cur=next;
    msg(`${G.players[next].name} の番...`);syncButtons();render();
    setTimeout(()=>runCpu(next),700);
  }
}

// ═══════════════════════════════════════════════════════
// ゲーム進行
// ═══════════════════════════════════════════════════════
function startGame() {
  initG(false);
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('ron-panel').classList.remove('visible');
  startHand();
}
function startHand() {
  const deck=shuffle(buildDeck());
  G.wangpai=deck.splice(deck.length-14);
  G.doraIndicators=[G.wangpai[4]];
  G.wall=deck;
  G.players=PNAMES.map((name,i)=>({
    name,isHuman:i===0,
    hand:sortHand(G.wall.splice(0,13)),
    drawn:null,discards:[],
  }));
  G.cur=G.dealer;G.sel=-1;G.canRiichi=false;
  G.riichi=[false,false,false,false];
  G.ippatsu=[false,false,false,false];
  G.doubleRiichi=[false,false,false,false];
  G.discardsMade=[0,0,0,0];
  msg(`${roundLabel()} ゲームスタート！`);
  document.getElementById('round-label').textContent=roundLabel();
  renderDoraBar();syncButtons();render();
  if(G.dealer===0)setTimeout(()=>startPlayerTurn(),400);
  else{G.phase='cpu';setTimeout(()=>runCpu(G.dealer),700);}
}
function roundLabel(){
  const r=Math.floor(G.handCount/4)===0?'東':'南';
  return r+(G.handCount%4+1)+'局';
}
function isHaitei(){return G.wall.length===0;}

function startPlayerTurn() {
  if(G.wall.length===0){endRyukyoku();return;}
  const tile=G.wall.pop();
  G.players[0].drawn=tile;
  G.phase='p-discard';G.cur=0;G.sel=-1;G.canRiichi=false;
  const hand14=[...G.players[0].hand,tile];
  renderWall();

  if(G.discardsMade[0]===0&&G.dealer===0&&isWin(hand14)){
    const info=applyWin(0,-1,hand14,tile,true,{tenho:true});
    render();finishWin('天和！',0,null,info,tile,true);return;
  }
  if(G.riichi[0]){
    if(isWin(hand14)){render();const info=applyWin(0,-1,hand14,tile,true,{haitei:isHaitei()});finishWin('ツモあがり！',0,null,info,tile,true);return;}
    msg(`リーチ中：${tname(tile)} を自動ツモ切り`);
    render();syncButtons();setTimeout(()=>discardPlayerTile(true,-1),1100);return;
  }
  if(isWin(hand14)){render();const info=applyWin(0,-1,hand14,tile,true,{haitei:isHaitei()});finishWin('ツモあがり！',0,null,info,tile,true);return;}
  msg(`ツモ：${tname(tile)}。捨てる牌をダブルクリック（または選んで「捨てる」）`);
  hint('ダブルクリック→即切り　シングルクリック→選択');
  syncButtons();render();
}
function playerDiscard() {
  if(G.phase!=='p-discard'||G.sel===-1)return;
  if(G.sel==='drawn')discardPlayerTile(true,-1);
  else discardPlayerTile(false,G.sel);
}
function declareRiichi() {
  if(!G.canRiichi||G.riichi[0])return;
  G.doubleRiichi[0]=(G.discardsMade[0]===0);
  G.riichi[0]=true;G.ippatsu[0]=true;
  G.scores[0]-=1000;G.riichiPot+=1000;
  renderScores();
  discardPlayerTile(G.sel==='drawn',G.sel==='drawn'?-1:G.sel);
}
function discardPlayerTile(isDrawn,idx) {
  if(G.phase!=='p-discard')return;
  const p=G.players[0];
  let discarded;
  if(isDrawn){discarded=p.drawn;p.drawn=null;}
  else{
    const s=sortHand(p.hand);discarded=s[idx];
    p.hand=sortHand([...s.filter((_,i)=>i!==idx),p.drawn]);p.drawn=null;
  }
  p.discards.push(discarded);G.discardsMade[0]++;G.sel=-1;G.canRiichi=false;hint('');
  const rIdx=ronCheck(discarded,0);
  if(rIdx!==-1){
    const info=applyWin(rIdx,0,[...G.players[rIdx].hand,discarded],discarded,false,{houtei:isHaitei()});
    render();finishWin(`${G.players[rIdx].name} がロン！`,rIdx,0,info,discarded,false);return;
  }
  G.ippatsu.forEach((_,i)=>{if(i!==0)G.ippatsu[i]=false;});
  render();startNextTurn(0);
}
function drawCpu(pidx) {
  if(G.wall.length===0){endRyukyoku();return null;}
  const tile=G.wall.pop();G.players[pidx].hand.push(tile);
  renderWall();return tile;
}
function ronCheck(tile,fromPidx) {
  for(let i=0;i<4;i++){
    if(i===fromPidx)continue;
    const th=[...G.players[i].hand,tile];
    if(isWin(th)&&detectYaku(th,tile,false,i,{houtei:isHaitei()}).filter(y=>y.name!=='ドラ').length)return i;
  }
  return -1;
}
function runCpu(pidx) {
  if(G.phase!=='cpu')return;
  const p=G.players[pidx];
  const tile=drawCpu(pidx);if(!tile)return;
  G.discardsMade[pidx]++;render();

  if(isWin(p.hand)){
    const chihoOk=pidx!==G.dealer&&G.discardsMade[pidx]===1&&G.players.every((pl,i)=>i===pidx||pl.discards.length===0);
    const extra={haitei:isHaitei(),chiho:chihoOk};
    const yaku=detectYaku(p.hand,tile,true,pidx,extra);
    if(yaku.filter(y=>y.name!=='ドラ').length){
      const info=applyWin(pidx,-1,p.hand,tile,true,extra);
      finishWin(`${p.name} がツモあがり！`,pidx,null,info,tile,true);return;
    }
  }
  const s=sortHand(p.hand),di=cpuChooseDiscard(s);
  const[discarded]=s.splice(di,1);p.hand=s;p.discards.push(discarded);render();

  const ph=[...G.players[0].hand,discarded];
  const ex0={houtei:isHaitei()};
  if(isWin(ph)&&detectYaku(ph,discarded,false,0,ex0).filter(y=>y.name!=='ドラ').length){offerRon(discarded,p.name,pidx);return;}
  for(let j=1;j<4;j++){
    if(j===pidx)continue;
    const jh=[...G.players[j].hand,discarded];
    const exj={houtei:isHaitei()};
    if(isWin(jh)&&detectYaku(jh,discarded,false,j,exj).filter(y=>y.name!=='ドラ').length){
      const info=applyWin(j,pidx,jh,discarded,false,exj);
      finishWin(`${G.players[j].name} がロン！`,j,pidx,info,discarded,false);return;
    }
  }
  G.ippatsu.forEach((_,i)=>{if(i!==pidx)G.ippatsu[i]=false;});
  startNextTurn(pidx);
}
function offerRon(tile,fromName,fromPidx) {
  G.phase='ron-offer';G.ronFromPidx=fromPidx;
  G.ronCb=(accepted)=>{
    if(accepted){
      const hand=[...G.players[0].hand,tile];
      const info=applyWin(0,fromPidx,hand,tile,false,{houtei:isHaitei()});
      finishWin('ロン！',0,fromPidx,info,tile,false);
    }else{G.ippatsu.forEach((_,i)=>{G.ippatsu[i]=false;});render();startNextTurn(fromPidx);}
  };
  document.getElementById('ron-msg').textContent=`${fromName} が ${tname(tile)} を捨てました。ロンできます！`;
  document.getElementById('ron-panel').classList.add('visible');syncButtons();
}
function declareRon(){document.getElementById('ron-panel').classList.remove('visible');const cb=G.ronCb;G.ronCb=null;if(cb)cb(true);}
function passRon()   {document.getElementById('ron-panel').classList.remove('visible');const cb=G.ronCb;G.ronCb=null;if(cb)cb(false);}

function finishWin(title,winnerPidx,loserPidx,info,winTile,isTsumo) {
  G.phase='win';syncButtons();render();
  const yakuStr=info?info.yaku.map(y=>`${y.name}(${y.han}翻)`).join(' + '):'（役なし）';
  const fuHan=info?`${info.fu}符${info.han}翻`:'';
  let ptsStr='';
  if(info){
    const{pts}=info;
    if(pts.type==='all')ptsStr=`各 ${pts.each}点払い → ${PNAMES[winnerPidx]} +${pts.total}点`;
    else if(pts.type==='tsumo')ptsStr=`親 ${pts.dealerPays}点・子 ${pts.otherPay}点払い → ${PNAMES[winnerPidx]} +${pts.total}点`;
    else ptsStr=`${PNAMES[winnerPidx]} +${pts.total}点`;
  }
  document.getElementById('ov-title').textContent=title;
  document.getElementById('ov-detail').textContent=fuHan;
  document.getElementById('ov-yaku').textContent=yakuStr;
  document.getElementById('ov-pts').textContent=ptsStr;
  renderScores();document.getElementById('overlay').classList.add('visible');
}
function endRyukyoku() {
  G.phase='end';render();
  document.getElementById('ov-title').textContent='流局';
  document.getElementById('ov-detail').textContent='山牌がなくなりました。';
  document.getElementById('ov-yaku').textContent='';document.getElementById('ov-pts').textContent='';
  document.getElementById('overlay').classList.add('visible');
}
function nextHand() {
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('ron-panel').classList.remove('visible');
  G.handCount++;
  if(G.scores.some(s=>s<=0)){alert('点数が0以下のプレイヤーが出ました。ゲーム終了です。');initG(false);syncButtons();return;}
  G.dealer=(G.dealer+1)%4;G.roundWind=Math.floor(G.handCount/4)%4;
  initG(true);startHand();
}

// ═══════════════════════════════════════════════════════
// UI
// ═══════════════════════════════════════════════════════
function msg(t){document.getElementById('status-msg').textContent=t;}
function hint(t){document.getElementById('hint-text').textContent=t;}
function syncButtons() {
  const p=G.phase;
  document.getElementById('btn-start').disabled   =!['idle','win','end'].includes(p);
  document.getElementById('btn-riichi').disabled  =p!=='p-discard'||!G.canRiichi||G.riichi[0];
  document.getElementById('btn-discard').disabled =p!=='p-discard'||G.sel===-1;
}
const SEAT_LABELS=['東','南','西','北'];
function renderScores() {
  for(let i=0;i<4;i++){
    const el=document.getElementById('sc'+i);
    const sw=seatWind(i);
    el.querySelector('.sname').textContent=PNAMES[i]+'（'+SEAT_LABELS[sw]+'）';
    el.querySelector('.sval').textContent=G.scores[i].toLocaleString();
    el.classList.toggle('is-dealer',G.dealer===i);
    el.classList.toggle('in-riichi',G.riichi[i]);
  }
}

// ═══════════════════════════════════════════════════════
// 山牌ビジュアル
// ═══════════════════════════════════════════════════════
function renderWall() {
  const row=document.getElementById('wall-row');
  const numEl=document.getElementById('wall-num');
  if(!row)return;
  const n=G.wall.length;
  numEl.textContent=n;
  row.innerHTML='';
  const low=n<=10;
  for(let i=0;i<n;i++){
    const t=document.createElement('div');
    t.className='wtile'+(low?' low':'');
    row.appendChild(t);
  }
}

// ═══════════════════════════════════════════════════════
// 牌の生成（リアルタイルデザイン）
// ═══════════════════════════════════════════════════════
function jihaiCls(idx) {
  if(idx===4)return'jh-haku';
  if(idx===5)return'jh-hatsu';
  if(idx===6)return'jh-chun';
  return'jh-wind';
}
function makeTile(tile,{size='sz-sm',faceDown=false,clickable=false,selected=false}={}) {
  const div=document.createElement('div');
  const classes=['tile',size];
  if(faceDown){
    classes.push('face-down');
  }else{
    classes.push('suit-'+tile.suit);
    if(tile.suit==='jihai')classes.push(jihaiCls(tile.idx));
  }
  if(clickable)classes.push('clickable');
  if(selected)classes.push('selected');
  div.className=classes.join(' ');

  if(!faceDown){
    const s=SUITS[tile.suit];
    const main=document.createElement('span');
    main.className='tile-main';
    main.textContent=s.chars[tile.idx];
    div.appendChild(main);
    if(s.sub){
      const sub=document.createElement('span');
      sub.className='tile-sub';
      sub.textContent=s.sub;
      div.appendChild(sub);
    }
  }
  return div;
}

function renderDoraBar() {
  const bar=document.getElementById('dora-bar');
  const tiles=document.getElementById('dora-tiles');
  tiles.innerHTML='';
  if(!G.doraIndicators||!G.doraIndicators.length){bar.classList.remove('visible');return;}
  bar.classList.add('visible');
  G.doraIndicators.forEach(t=>tiles.appendChild(makeTile(t,{size:'sz-sm'})));
}

function renderPlayerHand() {
  const con=document.getElementById('hand-player');
  con.innerHTML='';_handEls=[];_drawnEl=null;
  const p=G.players[0];if(!p)return;
  const sorted=sortHand(p.hand);
  const active=G.phase==='p-discard';
  sorted.forEach((tile,i)=>{
    const el=makeTile(tile,{size:'sz-lg',clickable:active,selected:active&&G.sel===i});
    if(active){
      el.addEventListener('click',e=>{
        if(e.detail>=2){discardPlayerTile(false,i);return;}
        G.sel=G.sel===i?-1:i;
        updateRiichiAvail();
        _handEls.forEach((t,j)=>t.classList.toggle('selected',j===G.sel));
        if(_drawnEl)_drawnEl.classList.toggle('selected',G.sel==='drawn');
        syncButtons();
      });
    }
    _handEls.push(el);con.appendChild(el);
  });
  if(p.drawn){
    const gap=document.createElement('div');gap.className='drawn-gap';con.appendChild(gap);
    _drawnEl=makeTile(p.drawn,{size:'sz-lg',clickable:active,selected:active&&G.sel==='drawn'});
    if(active){
      _drawnEl.addEventListener('click',e=>{
        if(e.detail>=2){discardPlayerTile(true,-1);return;}
        G.sel=G.sel==='drawn'?-1:'drawn';
        updateRiichiAvail();
        _handEls.forEach((t,j)=>t.classList.toggle('selected',j===G.sel));
        _drawnEl.classList.toggle('selected',G.sel==='drawn');
        syncButtons();
      });
    }
    con.appendChild(_drawnEl);
  }
}
function updateRiichiAvail() {
  if(G.riichi[0]||G.sel===-1){G.canRiichi=false;return;}
  const isDrawn=G.sel==='drawn';
  G.canRiichi=isTenpai(handAfterDiscard(isDrawn?-1:G.sel,isDrawn))&&G.scores[0]>=1000;
}
function renderCpuHand(pidx,elId) {
  const el=document.getElementById(elId);el.innerHTML='';
  if(!G.players[pidx])return;
  G.players[pidx].hand.forEach(()=>el.appendChild(makeTile({suit:'man',idx:0},{size:'sz-xs',faceDown:true})));
}
function renderDiscards(elId,discards) {
  const el=document.getElementById(elId);el.innerHTML='';
  discards.slice(-15).forEach(t=>el.appendChild(makeTile(t,{size:'sz-xs'})));
}
function render() {
  if(!G.players.length)return;
  renderWall();
  renderScores();
  renderPlayerHand();
  renderCpuHand(1,'hand-cpu1');
  renderCpuHand(2,'hand-cpu2');
  renderCpuHand(3,'hand-cpu3');
  renderDiscards('disc-0',G.players[0].discards);
  renderDiscards('disc-1',G.players[1].discards);
  renderDiscards('disc-2',G.players[2].discards);
  renderDiscards('disc-3',G.players[3].discards);
}

msg('「ゲームスタート」を押してください。');
syncButtons();
</script>
