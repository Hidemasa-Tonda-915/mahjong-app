<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>麻雀ゲーム</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #1a5c2a;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 8px;
      color: #f0e68c;
      user-select: none;
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 0.12em;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      margin-bottom: 8px;
    }

    /* ── ステータスバー ── */
    .status-bar {
      width: 100%;
      max-width: 880px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.35);
      border-radius: 8px;
      padding: 6px 14px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      gap: 8px;
    }
    #status-msg { font-weight: 600; flex: 1; }

    /* ── コントロール ── */
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 8px;
    }

    button {
      background: #f0e68c;
      border: none;
      border-radius: 8px;
      padding: 9px 22px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      color: #1a1a1a;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      transition: background 0.12s, transform 0.1s;
    }
    button:hover:not(:disabled) { background: #f7d94c; transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    button.btn-ron { background: #e63946; color: #fff; }
    button.btn-ron:hover:not(:disabled) { background: #b02832; }

    /* ── ロンパネル ── */
    .ron-panel {
      display: none;
      background: rgba(0,0,0,0.85);
      border: 2px solid #f0e68c;
      border-radius: 10px;
      padding: 10px 20px;
      margin-bottom: 8px;
      text-align: center;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 880px;
    }
    .ron-panel.visible { display: flex; }
    .ron-panel p { font-size: 0.88rem; }
    .ron-btns { display: flex; gap: 10px; }

    /* ── ゲームテーブル ── */
    .table {
      width: 100%;
      max-width: 880px;
      background: #155a28;
      border: 4px solid #7a5c1a;
      border-radius: 18px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .area-label {
      font-size: 0.7rem;
      opacity: 0.8;
      letter-spacing: 0.05em;
    }

    /* ── 中段 ── */
    .middle {
      display: grid;
      grid-template-columns: 130px 1fr 130px;
      gap: 8px;
      align-items: start;
    }

    /* ── センター捨て牌 ── */
    .center {
      background: rgba(0,0,0,0.22);
      border-radius: 10px;
      padding: 6px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      grid-template-rows: auto auto auto;
      gap: 4px;
      align-items: center;
      justify-items: center;
    }

    .disc-zone {
      display: flex;
      flex-wrap: wrap;
      gap: 1px;
      justify-content: center;
      align-items: flex-start;
      min-height: 34px;
    }
    .disc-zone.top    { grid-column: 2; grid-row: 1; }
    .disc-zone.left   { grid-column: 1; grid-row: 2; justify-content: flex-end; }
    .disc-zone.right  { grid-column: 3; grid-row: 2; justify-content: flex-start; }
    .disc-zone.bottom { grid-column: 2; grid-row: 3; }

    .wall-info {
      grid-column: 2; grid-row: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 14px;
    }
    .wall-info .wall-num { font-size: 1.5rem; font-weight: bold; }
    .wall-info .wall-lbl { font-size: 0.6rem; opacity: 0.7; }

    /* ── 手牌エリア ── */
    .hand-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 2px;
      min-height: 44px;
    }

    .player-hand {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-end;
      gap: 2px;
      min-height: 92px;
      padding: 6px 4px 4px;
    }

    /* ── 牌 ── */
    .tile {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #fffff0;
      border: 2px solid #c8b06a;
      border-radius: 5px;
      position: relative;
      flex-shrink: 0;
      transition: transform 0.12s, box-shadow 0.12s;
      box-shadow: 1px 2px 3px rgba(0,0,0,0.3);
    }

    /* サイズ */
    .tile.sz-lg { width: 52px; height: 70px; }
    .tile.sz-sm { width: 28px; height: 40px; }
    .tile.sz-xs { width: 22px; height: 30px; }

    /* 牌面の絵柄（Unicode麻雀タイル） */
    .tile-face {
      font-family: 'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif;
      line-height: 1;
      pointer-events: none;
    }
    .tile.sz-lg .tile-face { font-size: 2.7rem; }
    .tile.sz-sm .tile-face { font-size: 1.45rem; }
    .tile.sz-xs .tile-face { font-size: 1.15rem; }

    /* 裏面 */
    .tile.face-down {
      background: linear-gradient(150deg, #2c5f8a, #1a3d5c);
      border-color: #4a7090;
      box-shadow: 1px 2px 3px rgba(0,0,0,0.4);
    }

    /* クリック可能 */
    .tile.clickable { cursor: pointer; }
    .tile.clickable:hover {
      transform: translateY(-7px);
      box-shadow: 1px 9px 12px rgba(0,0,0,0.45);
    }

    /* 選択中 */
    .tile.selected {
      transform: translateY(-20px) !important;
      border-color: #e63946 !important;
      background: #fff5f5 !important;
      box-shadow: 1px 14px 18px rgba(0,0,0,0.55) !important;
    }

    /* ツモ牌とのギャップ */
    .drawn-gap {
      width: 14px;
      flex-shrink: 0;
      align-self: stretch;
    }

    /* ── 結果オーバーレイ ── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.72);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .overlay.visible { display: flex; }
    .overlay-box {
      background: #1a5c2a;
      border: 3px solid #f0e68c;
      border-radius: 16px;
      padding: 32px 48px;
      text-align: center;
      max-width: 90vw;
    }
    .overlay-box h2 { font-size: 1.8rem; margin-bottom: 10px; }
    .overlay-box p  { margin-bottom: 20px; opacity: 0.85; font-size: 0.95rem; }

    .hint { font-size: 0.72rem; opacity: 0.65; margin-top: 2px; }
  </style>
</head>
<body>

<h1>麻雀ゲーム</h1>

<div class="status-bar">
  <span id="status-msg">「ゲームスタート」を押してください</span>
  <span id="wall-count">山牌 — 枚</span>
</div>

<div class="controls">
  <button id="btn-start"   onclick="startGame()">ゲームスタート</button>
  <button id="btn-discard" onclick="playerDiscard()" disabled>捨てる</button>
</div>

<div class="ron-panel" id="ron-panel">
  <p id="ron-msg"></p>
  <div class="ron-btns">
    <button class="btn-ron" onclick="declareRon()">ロン！</button>
    <button onclick="passRon()">スキップ</button>
  </div>
</div>

<div class="table">

  <!-- CPU2（上） -->
  <div class="area">
    <div class="area-label">CPU2</div>
    <div class="hand-row" id="hand-cpu2"></div>
  </div>

  <!-- 中段 -->
  <div class="middle">

    <!-- CPU1（左） -->
    <div class="area">
      <div class="area-label">CPU1</div>
      <div class="hand-row" id="hand-cpu1" style="max-width:130px;"></div>
    </div>

    <!-- センター -->
    <div class="center">
      <div class="disc-zone top"    id="disc-2"></div>
      <div class="disc-zone left"   id="disc-1"></div>
      <div class="wall-info">
        <div class="wall-num" id="wall-num">—</div>
        <div class="wall-lbl">山牌</div>
      </div>
      <div class="disc-zone right"  id="disc-3"></div>
      <div class="disc-zone bottom" id="disc-0"></div>
    </div>

    <!-- CPU3（右） -->
    <div class="area">
      <div class="area-label">CPU3</div>
      <div class="hand-row" id="hand-cpu3" style="max-width:130px;"></div>
    </div>

  </div>

  <!-- プレイヤー（下） -->
  <div class="area">
    <div class="area-label">あなたの手牌</div>
    <div class="player-hand" id="hand-player"></div>
    <div class="hint" id="hint-text"></div>
  </div>

</div>

<!-- 結果オーバーレイ -->
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="overlay-title"></h2>
    <p id="overlay-msg"></p>
    <button onclick="newGame()">もう一度プレイ</button>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────
// 定数
// ─────────────────────────────────────────────────────────

// 表示用 Unicode 麻雀タイル
const SUITS = {
  man:   { chars: ['🀇','🀈','🀉','🀊','🀋','🀌','🀍','🀎','🀏'] },
  pin:   { chars: ['🀙','🀚','🀛','🀜','🀝','🀞','🀟','🀠','🀡'] },
  sou:   { chars: ['🀐','🀑','🀒','🀓','🀔','🀕','🀖','🀗','🀘'] },
  jihai: { chars: ['🀀','🀁','🀂','🀃','🀆','🀅','🀄'] },
};

// ステータスメッセージ用テキスト名
const TILE_NAMES = {
  man:   ['１萬','２萬','３萬','４萬','５萬','６萬','７萬','８萬','９萬'],
  pin:   ['１筒','２筒','３筒','４筒','５筒','６筒','７筒','８筒','９筒'],
  sou:   ['１索','２索','３索','４索','５索','６索','７索','８索','９索'],
  jihai: ['東','南','西','北','白','發','中'],
};

const SUIT_ORDER = { man: 0, pin: 1, sou: 2, jihai: 3 };
const PLAYER_NAMES = ['あなた', 'CPU1', 'CPU2', 'CPU3'];

// ─────────────────────────────────────────────────────────
// ゲーム状態
// ─────────────────────────────────────────────────────────
let G = {};

function initG() {
  G = {
    phase: 'idle',  // idle | p-discard | cpu | ron-offer | win | end
    wall: [],
    players: [],    // [{name, hand(13枚), drawn(ツモ牌|null), discards, isHuman}]
    cur: 0,
    sel: -1,        // -1=未選択 / 0〜12=手牌インデックス / 'drawn'=ツモ牌
    ronCb: null,
    ronFromPidx: -1,
  };
}
initG();

// DOM参照（ダブルクリック時のDOM再生成を避けるため）
let _handEls = [];
let _drawnEl = null;

// ─────────────────────────────────────────────────────────
// 牌ユーティリティ
// ─────────────────────────────────────────────────────────
function buildDeck() {
  const deck = [];
  let id = 0;
  for (const suit of Object.keys(SUITS))
    for (let idx = 0; idx < SUITS[suit].chars.length; idx++)
      for (let k = 0; k < 4; k++)
        deck.push({ suit, idx, id: id++ });
  return deck;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

const tileCmp = (a, b) =>
  (SUIT_ORDER[a.suit] - SUIT_ORDER[b.suit]) || (a.idx - b.idx);

const sortHand = hand => hand.slice().sort(tileCmp);

const tileName = t => TILE_NAMES[t.suit][t.idx];

// ─────────────────────────────────────────────────────────
// あがり判定
// ─────────────────────────────────────────────────────────
function counts(tiles) {
  const c = {};
  for (const t of tiles) {
    const k = t.suit + '-' + t.idx;
    c[k] = (c[k] || 0) + 1;
  }
  return c;
}

function canMentsu(c) {
  let minKey = null;
  for (const k of Object.keys(c)) {
    if (!minKey) { minKey = k; continue; }
    const [ms, mi] = minKey.split('-');
    const [ks, ki] = k.split('-');
    if ((SUIT_ORDER[ks] - SUIT_ORDER[ms]) || (+ki - +mi) < 0) minKey = k;
  }
  if (!minKey) return true;

  const [suit, idxStr] = minKey.split('-');
  const idx = +idxStr;

  if (c[minKey] >= 3) {
    const nc = { ...c }; nc[minKey] -= 3; if (!nc[minKey]) delete nc[minKey];
    if (canMentsu(nc)) return true;
  }
  if (suit !== 'jihai') {
    const k1 = suit + '-' + (idx + 1);
    const k2 = suit + '-' + (idx + 2);
    if ((c[k1] || 0) >= 1 && (c[k2] || 0) >= 1) {
      const nc = { ...c };
      nc[minKey]--; if (!nc[minKey]) delete nc[minKey];
      nc[k1]--;     if (!nc[k1])     delete nc[k1];
      nc[k2]--;     if (!nc[k2])     delete nc[k2];
      if (canMentsu(nc)) return true;
    }
  }
  return false;
}

function isWin(hand) {
  if (hand.length !== 14) return false;
  const c = counts(hand);
  const vals = Object.values(c);
  if (vals.length === 7 && vals.every(v => v === 2)) return true; // 七対子

  const tried = new Set();
  for (const t of hand) {
    const k = t.suit + '-' + t.idx;
    if (tried.has(k)) continue;
    tried.add(k);
    if ((c[k] || 0) >= 2) {
      const nc = { ...c }; nc[k] -= 2; if (!nc[k]) delete nc[k];
      if (canMentsu(nc)) return true;
    }
  }
  return false;
}

// ─────────────────────────────────────────────────────────
// CPU AI
// ─────────────────────────────────────────────────────────
function cpuChooseDiscard(hand) {
  const sorted = sortHand(hand);
  const c = counts(sorted);
  let worstIdx = 0, worstScore = Infinity;
  sorted.forEach((t, i) => {
    const k = t.suit + '-' + t.idx;
    let score = (c[k] || 0) * 10;
    if (t.suit !== 'jihai')
      for (const d of [-2, -1, 1, 2]) {
        if (c[t.suit + '-' + (t.idx + d)]) score += (Math.abs(d) === 1 ? 5 : 2);
      }
    if (score < worstScore) { worstScore = score; worstIdx = i; }
  });
  return worstIdx;
}

// ─────────────────────────────────────────────────────────
// ゲーム進行
// ─────────────────────────────────────────────────────────
function startGame() {
  initG();
  const deck = shuffle(buildDeck());
  G.players = PLAYER_NAMES.map((name, i) => ({
    name, isHuman: i === 0,
    hand: sortHand(deck.splice(0, 13)),
    drawn: null,
    discards: [],
  }));
  G.wall = deck;
  G.cur = 0;
  msg('ゲームスタート！');
  syncButtons();
  render();
  setTimeout(() => startPlayerTurn(), 400);
}

// プレイヤーのツモ（自動）
function startPlayerTurn() {
  if (G.wall.length === 0) { endRyukyoku(); return; }

  const tile = G.wall.pop();
  G.players[0].drawn = tile;
  G.phase = 'p-discard';
  G.sel = -1;

  if (isWin([...G.players[0].hand, tile])) {
    render();
    finishWin('ツモあがり！', `${tileName(tile)} をツモって上がりました！`);
    return;
  }

  msg(`ツモ：${tileName(tile)}。捨てる牌をダブルクリック、または選んで「捨てる」。`);
  hint('ダブルクリック → 即切り　シングルクリック → 選択');
  syncButtons();
  render();
}

// プレイヤーの捨て牌（ボタン経由）
function playerDiscard() {
  if (G.phase !== 'p-discard' || G.sel === -1) return;
  if (G.sel === 'drawn') {
    discardPlayerTile(true, -1);
  } else {
    discardPlayerTile(false, G.sel);
  }
}

// プレイヤーの捨て牌（共通処理）
// isDrawn=true → ツモ牌を切る / false → 手牌インデックス idx を切る
function discardPlayerTile(isDrawn, idx) {
  if (G.phase !== 'p-discard') return;
  const p = G.players[0];
  let discarded;

  if (isDrawn) {
    discarded = p.drawn;
    p.drawn = null;
    // hand は 13 枚のまま
  } else {
    const sorted = sortHand(p.hand);
    discarded = sorted[idx];
    // ツモ牌を手牌に統合し、選んだ牌を捨てる
    const remaining = sorted.filter((_, i) => i !== idx);
    p.hand = sortHand([...remaining, p.drawn]);
    p.drawn = null;
  }

  p.discards.push(discarded);
  G.sel = -1;
  hint('');

  // 他プレイヤーのロンチェック（CPU は自動）
  const rIdx = ronCheck(discarded, 0);
  if (rIdx !== -1) {
    render();
    finishWin(`${G.players[rIdx].name} がロン！`,
      `あなたの捨てた ${tileName(discarded)} で上がられました。`);
    return;
  }

  render();
  nextCpu(1);
}

// 山から CPU がツモ
function drawCpu(pidx) {
  if (G.wall.length === 0) { endRyukyoku(); return null; }
  const tile = G.wall.pop();
  G.players[pidx].hand.push(tile);
  return tile;
}

// ロンチェック（対象プレイヤーの手牌 13 枚 + 牌 = 14 枚）
function ronCheck(tile, fromPidx) {
  for (let i = 0; i < 4; i++) {
    if (i === fromPidx) continue;
    if (isWin([...G.players[i].hand, tile])) return i;
  }
  return -1;
}

// CPU のターンチェーン
function nextCpu(pidx) {
  if (pidx > 3) {
    G.cur = 0;
    msg('あなたの番です。ツモります...');
    syncButtons();
    render();
    setTimeout(() => startPlayerTurn(), 350);
    return;
  }
  G.phase = 'cpu';
  G.cur = pidx;
  msg(`${G.players[pidx].name} の番...`);
  syncButtons();
  render();
  setTimeout(() => runCpu(pidx), 700);
}

function runCpu(pidx) {
  if (G.phase !== 'cpu') return;
  const p = G.players[pidx];

  const tile = drawCpu(pidx);
  if (!tile) return;
  render();

  // ツモあがりチェック（CPU hand は 14 枚）
  if (isWin(p.hand)) {
    finishWin(`${p.name} がツモあがり！`, `${tileName(tile)} をツモって上がりました。`);
    return;
  }

  // CPU が捨て牌を選ぶ
  const sorted = sortHand(p.hand);
  const di = cpuChooseDiscard(sorted);
  const [discarded] = sorted.splice(di, 1);
  p.hand = sorted;
  p.discards.push(discarded);
  render();

  // プレイヤーのロンオファー（優先）
  if (isWin([...G.players[0].hand, discarded])) {
    offerRon(discarded, p.name, pidx);
    return;
  }

  // 他 CPU のロンチェック（自動）
  for (let j = 1; j < 4; j++) {
    if (j === pidx) continue;
    if (isWin([...G.players[j].hand, discarded])) {
      finishWin(`${G.players[j].name} がロン！`,
        `${p.name} の捨てた ${tileName(discarded)} で上がりました。`);
      return;
    }
  }

  setTimeout(() => nextCpu(pidx + 1), 500);
}

function offerRon(tile, fromName, fromPidx) {
  G.phase = 'ron-offer';
  G.ronFromPidx = fromPidx;
  G.ronCb = (accepted) => {
    if (accepted) {
      finishWin('ロン！', `${fromName} の捨てた ${tileName(tile)} で上がり！`);
    } else {
      render();
      setTimeout(() => nextCpu(fromPidx + 1), 400);
    }
  };
  document.getElementById('ron-msg').textContent =
    `${fromName} が ${tileName(tile)} を捨てました。ロンできます！`;
  document.getElementById('ron-panel').classList.add('visible');
  syncButtons();
}

function declareRon() {
  document.getElementById('ron-panel').classList.remove('visible');
  const cb = G.ronCb; G.ronCb = null;
  if (cb) cb(true);
}

function passRon() {
  document.getElementById('ron-panel').classList.remove('visible');
  const cb = G.ronCb; G.ronCb = null;
  if (cb) cb(false);
}

function finishWin(title, detail) {
  G.phase = 'win';
  syncButtons();
  render();
  showOverlay(title, detail);
}

function endRyukyoku() {
  G.phase = 'end';
  render();
  showOverlay('流局', '山牌がなくなりました。');
}

function showOverlay(title, detail) {
  document.getElementById('overlay-title').textContent = title;
  document.getElementById('overlay-msg').textContent = detail;
  document.getElementById('overlay').classList.add('visible');
}

function newGame() {
  document.getElementById('overlay').classList.remove('visible');
  document.getElementById('ron-panel').classList.remove('visible');
  startGame();
}

// ─────────────────────────────────────────────────────────
// UI ヘルパー
// ─────────────────────────────────────────────────────────
function msg(text) { document.getElementById('status-msg').textContent = text; }
function hint(text) { document.getElementById('hint-text').textContent = text; }

function syncButtons() {
  const p = G.phase;
  document.getElementById('btn-start').disabled   = !['idle','win','end'].includes(p);
  document.getElementById('btn-discard').disabled = p !== 'p-discard' || G.sel === -1;
}

// ─────────────────────────────────────────────────────────
// 描画
// ─────────────────────────────────────────────────────────
function makeTile(tile, opts = {}) {
  const { size = 'sz-sm', faceDown = false, clickable = false, selected = false } = opts;
  const div = document.createElement('div');
  div.className = ['tile', size,
    faceDown  ? 'face-down' : '',
    clickable ? 'clickable' : '',
    selected  ? 'selected'  : '',
  ].filter(Boolean).join(' ');

  if (!faceDown) {
    const s = document.createElement('span');
    s.className = 'tile-face';
    s.textContent = SUITS[tile.suit].chars[tile.idx];
    div.appendChild(s);
  }
  return div;
}

// プレイヤー手牌の描画
// シングルクリックで選択（DOMクラス直接操作）、ダブルクリックで即切り
function renderPlayerHand() {
  const container = document.getElementById('hand-player');
  container.innerHTML = '';
  _handEls = [];
  _drawnEl = null;

  const p = G.players[0];
  if (!p) return;

  const sorted = sortHand(p.hand);
  const active = G.phase === 'p-discard';

  sorted.forEach((tile, i) => {
    const el = makeTile(tile, {
      size: 'sz-lg',
      clickable: active,
      selected: active && G.sel === i,
    });

    if (active) {
      el.addEventListener('click', (e) => {
        if (e.detail >= 2) {
          // ダブルクリック → 即切り
          discardPlayerTile(false, i);
          return;
        }
        // シングルクリック → 選択トグル（DOM を再生成せず class 操作のみ）
        G.sel = G.sel === i ? -1 : i;
        _handEls.forEach((t, j) => t.classList.toggle('selected', j === G.sel));
        if (_drawnEl) _drawnEl.classList.toggle('selected', G.sel === 'drawn');
        syncButtons();
      });
    }

    _handEls.push(el);
    container.appendChild(el);
  });

  // ツモ牌（ギャップを挟んで末尾に表示）
  if (p.drawn) {
    const gap = document.createElement('div');
    gap.className = 'drawn-gap';
    container.appendChild(gap);

    _drawnEl = makeTile(p.drawn, {
      size: 'sz-lg',
      clickable: active,
      selected: active && G.sel === 'drawn',
    });

    if (active) {
      _drawnEl.addEventListener('click', (e) => {
        if (e.detail >= 2) {
          discardPlayerTile(true, -1);
          return;
        }
        G.sel = G.sel === 'drawn' ? -1 : 'drawn';
        _handEls.forEach((t, j) => t.classList.toggle('selected', j === G.sel));
        _drawnEl.classList.toggle('selected', G.sel === 'drawn');
        syncButtons();
      });
    }

    container.appendChild(_drawnEl);
  }
}

function renderCpuHand(pidx, elId) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  if (!G.players[pidx]) return;
  G.players[pidx].hand.forEach(() =>
    el.appendChild(makeTile({ suit: 'man', idx: 0 }, { size: 'sz-xs', faceDown: true }))
  );
}

function renderDiscards(elId, discards) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  discards.slice(-15).forEach(t =>
    el.appendChild(makeTile(t, { size: 'sz-xs' }))
  );
}

function render() {
  if (!G.players.length) return;

  document.getElementById('wall-num').textContent = G.wall.length;
  document.getElementById('wall-count').textContent = `山牌 ${G.wall.length} 枚`;

  renderPlayerHand();
  renderCpuHand(1, 'hand-cpu1');
  renderCpuHand(2, 'hand-cpu2');
  renderCpuHand(3, 'hand-cpu3');

  renderDiscards('disc-0', G.players[0].discards);
  renderDiscards('disc-1', G.players[1].discards);
  renderDiscards('disc-2', G.players[2].discards);
  renderDiscards('disc-3', G.players[3].discards);
}

// 初期表示
msg('「ゲームスタート」を押してください。');
syncButtons();
</script>
</body>
</html>
